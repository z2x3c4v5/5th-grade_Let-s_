<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's ~ 권유하기 · 듣고 따라 말하기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🗣️ Let's ~ 권유하기</h1>
    <p class="subtitle">듣고 따라 말해 보아요! · Listen &amp; Repeat</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="learn">📖 표현 배우기</button>
    <button class="tab-btn" data-tab="practice">🎮 대화 연습</button>
  </nav>

  <main>
    <!-- ===== 표현 배우기 ===== -->
    <section id="tab-learn" class="tab-panel active">
      <div class="section-block">
        <h2>① 권유하는 문장 <span class="count">25개</span></h2>
        <p class="hint">카드를 누르면 소리가 나와요. 잘 듣고 따라 말해 보세요.</p>
        <div id="suggestion-grid" class="card-grid"></div>
      </div>

      <div class="section-block">
        <h2>② 좋아요! 긍정 대답 <span class="count pos">4개</span></h2>
        <div id="positive-grid" class="card-grid small"></div>
      </div>

      <div class="section-block">
        <h2>③ 미안해! 거절 대답 <span class="count neg">4개</span></h2>
        <div id="refusal-grid" class="card-grid small"></div>
      </div>
    </section>

    <!-- ===== 대화 연습 ===== -->
    <section id="tab-practice" class="tab-panel">
      <div class="practice-stage">
        <div id="practice-card" class="practice-card">
          <div class="practice-emoji">🎲</div>
          <div class="practice-en">아래 버튼을 눌러 시작하세요!</div>
          <div class="practice-ko">Press the button to start!</div>
        </div>

        <div class="practice-controls">
          <button id="btn-new" class="btn primary">🎲 새 문장</button>
          <button id="btn-listen" class="btn" disabled>🔊 다시 듣기</button>
          <button id="btn-mic" class="btn" disabled>🎤 따라 말하기</button>
        </div>

        <div id="mic-result" class="mic-result"></div>

        <div id="response-box" class="response-box hidden">
          <p class="response-label">친구의 대답 👇</p>
          <div id="response-card" class="response-card">
            <span class="response-emoji"></span>
            <span class="response-en"></span>
            <span class="response-ko"></span>
          </div>
          <button id="btn-listen-response" class="btn small">🔊 대답 듣기</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <label class="speed-control">
      말하기 속도
      <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="0.85" />
    </label>
    <span id="voice-status" class="voice-status"></span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
