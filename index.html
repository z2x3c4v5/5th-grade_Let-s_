<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's ~ 권유하기 · 듣고 따라 말하기</title>
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Let's ~ 권유하기</h1>
    <p class="subtitle">듣고 따라 말해 보아요 · Listen &amp; Repeat</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="suggest">권유하는 문장</button>
    <button class="tab-btn" data-tab="positive">긍정 대답</button>
    <button class="tab-btn" data-tab="negative">부정 대답</button>
  </nav>

  <main>
    <!-- ===== 권유하는 문장 ===== -->
    <section id="tab-suggest" class="tab-panel active">
      <div class="section-block">
        <h2>권유하는 문장 <span class="count">29개</span></h2>
        <div class="level-switch">
          <button class="level-btn active" data-level="beginner">초급</button>
          <button class="level-btn" data-level="intermediate">중급</button>
          <button class="level-btn" data-level="advanced">고급</button>
        </div>
        <div class="cat-switch">
          <button class="cat-btn active" data-cat="all">전체</button>
          <button class="cat-btn" data-cat="sports">⚽ 운동·스포츠</button>
          <button class="cat-btn" data-cat="indoor">🎮 실내 놀이</button>
          <button class="cat-btn" data-cat="food">🍪 먹거리</button>
          <button class="cat-btn" data-cat="outdoor">🌳 야외 나들이</button>
        </div>
        <p class="hint">난이도와 활동 종류를 고르고, 단어를 누르면 뜻과 발음을 알 수 있어요.</p>
        <div id="suggestion-grid" class="card-grid five"></div>
      </div>
    </section>

    <!-- ===== 긍정 대답 ===== -->
    <section id="tab-positive" class="tab-panel">
      <div class="section-block">
        <h2>좋아요! 긍정 대답 <span class="count pos">4개</span></h2>
        <p class="hint">권유에 기분 좋게 대답하는 표현이에요.</p>
        <div id="positive-grid" class="card-grid answers"></div>
      </div>
    </section>

    <!-- ===== 부정 대답 ===== -->
    <section id="tab-negative" class="tab-panel">
      <div class="section-block">
        <h2>미안해! 거절 대답 <span class="count neg">4개</span></h2>
        <p class="hint">권유를 정중하게 거절하는 표현이에요.</p>
        <div id="refusal-grid" class="card-grid answers"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <label class="speed-control">
      말하기 속도
      <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="0.85" />
    </label>
    <span id="voice-status" class="voice-status"></span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
